name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            VERSION="$REF_NAME"
          else
            VERSION="dev-${SHA:0:7}"
          fi
          NAME="letters-${VERSION}-linux-${ARCH}"
          mkdir -p "dist/${NAME}"
          cp target/release/letters LICENSE README.md "dist/${NAME}/"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -l "${NAME}.tar.gz"*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: letters-${{ matrix.arch }}
          path: letters-*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: letters-*
          merge-multiple: true
          path: dist

      - name: Create or update GitHub release
        run: |
          cd dist
          if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *.tar.gz *.sha256
          else
            gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Letters $REF_NAME" --generate-notes *.tar.gz *.sha256
          fi
